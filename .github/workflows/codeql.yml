---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 1 * * 0"
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read # read workflow metadata for actions-language analysis
      contents: read # check out sources to scan
      packages: read # fetch CodeQL query packs
      security-events: write # upload SARIF results
    strategy:
      fail-fast: false
      matrix:
        language: ["actions"]
    steps:
      - name: CodeQL Analysis
        uses: ivuorinen/actions/codeql-analysis@7ad79268dba5d86a7ec07512519b9d985c5ef208 # v2026.09.08
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
